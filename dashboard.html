<!DOCTYPE html>
<html>
<head>
  <title>Dashboard V3.5</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="padding:20px;">Career Intelligence Dashboard</h2>

<div class="grid">

  <!-- LEFT PANEL -->
  <div class="card">
    <h3>Create Resume</h3>

    <textarea id="input" placeholder="Enter job or skills..."></textarea>

    <button onclick="generate()">Generate</button>
  </div>

  <!-- RIGHT PANEL -->
  <div class="card">
    <h3>ATS Score</h3>
    <div class="ats-circle" id="atsScore">0%</div>

    <h3>Career Score</h3>
    <div id="careerScore">--</div>
  </div>

</div>

<!-- RESUME PREVIEW -->
<div class="card resume" id="output"></div>

<button onclick="downloadPDF()">Download Resume PDF</button>

<script src="engine/resumeEngine.js"></script>
<script src="engine/atsEngine.js"></script>
<script src="engine/scoreEngine.js"></script>
<script src="export/pdf.js"></script>

<script>
function generate() {

  const input = document.getElementById("input").value;
  const resume = buildResume(input);

  document.getElementById("output").innerHTML = `
    <h1>${resume.role}</h1>
    <p>${resume.summary}</p>

    <h3>Skills</h3>
    <ul>
      ${resume.skills.map(s => `<li>${s}</li>`).join("")}
    </ul>
  `;

  document.getElementById("atsScore").innerText = resume.atsScore + "%";
  document.getElementById("careerScore").innerText = resume.careerScore;
}
</script>

</body>
</html>
